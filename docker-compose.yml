version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000

  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file:
      - path: .env
        required: false

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  redis:
    image: redis:7-alpine
    profiles: ["live"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  db:
    image: postgres:15-alpine
    profiles: ["live"]
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=urls
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    profiles: ["live"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    profiles: ["live"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

volumes:
  redisdata:
  pgdata:
